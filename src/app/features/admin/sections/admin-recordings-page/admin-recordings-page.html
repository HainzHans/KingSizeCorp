<p-toast />

<p-confirmDialog>
  <ng-template #headless let-message let-onAccept="onAccept" let-onReject="onReject">
    <div class="confirm-dialog">
      <div class="confirm-dialog__icon">
        <i class="pi pi-trash"></i>
      </div>
      <div class="confirm-dialog__body">
        <h3 class="confirm-dialog__title">{{ message.header }}</h3>
        <p class="confirm-dialog__message">
          Aufzeichnung <strong>{{ message.message }}</strong> wirklich löschen?
        </p>
      </div>
      <div class="confirm-dialog__actions">
        <button class="confirm-btn confirm-btn--cancel" (click)="onReject()">Abbrechen</button>
        <button class="confirm-btn confirm-btn--delete" (click)="onAccept()">
          <i class="pi pi-trash"></i>
          Löschen
        </button>
      </div>
    </div>
  </ng-template>
</p-confirmDialog>

<div class="recordings-admin">

  <!-- ── Header ── -->
  <div class="page-header">
    <div>
      <span class="page-eyebrow">Admin · Aufzeichnungen</span>
      <h1 class="page-title">Aufzeichnungen</h1>
    </div>
    <button class="btn-add" (click)="openCreate()">
      <i class="pi pi-plus"></i>
      <span>Hinzufügen</span>
    </button>
  </div>

  <!-- ── Liste ── -->
  @if (loading()) {
    <div class="empty-state">
      <i class="pi pi-spin pi-spinner"></i>
      <span>Aufzeichnungen werden geladen …</span>
    </div>
  } @else if (recordings().length === 0) {
    <div class="empty-state">
      <i class="pi pi-video"></i>
      <span>Noch keine Aufzeichnungen angelegt</span>
    </div>
  } @else {
    <div class="rec-list">
      @for (rec of recordings(); track rec.id) {
        <app-admin-recording-card
          [recording]="rec"
          (edit)="openEdit(rec)"
          (delete)="confirmDelete(rec, $event)"
        />
      }
    </div>
  }

</div>

<!-- ── Dialog: Erstellen / Bearbeiten ── -->
<app-recording-form-dialog
  [(visible)]="showDialog"
  [recording]="editingRecording()"
  [saving]="saving()"
  (save)="save($event)"
  (invalid)="onInvalid()"
/>
