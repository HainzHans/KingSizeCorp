<section class="card-grid-container">
  <div class="container">
    <div class="card-grid-title-wrapper">
      <h2>
        Was ich dir außerdem
        <br>
         noch anbieten werde
      </h2>
      <p class="grey-text">
        Wie ich dich unterstütze, damit auch du reale Profite am Markt erreichen wirst
      </p>
    </div>
    <div class="card-grid-wrapper">
      @for (card of cards; track card.title) {
        <app-feature-card [icon]="card.icon" [title]="card.title" [text]="card.text" />
      }
    </div>
  </div>
</section>
