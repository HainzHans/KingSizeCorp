<app-auth-card title="Willkommen zurück">
  <p class="auth-subtitle">Melde dich in deinem Mitgliederbereich an.</p>

  <div class="auth-field">
    <label for="login-email">E-Mail</label>
    <input
      id="login-email"
      type="email"
      pInputText
      [(ngModel)]="email"
      placeholder="deine@email.de"
      autocomplete="username"
      (keyup.enter)="login()"
    />
  </div>

  <div class="auth-field">
    <label for="login-password">Passwort</label>
    <p-password
      inputId="login-password"
      [(ngModel)]="password"
      [feedback]="false"
      toggleMask="true"
      placeholder="Passwort eingeben"
      (keyup.enter)="login()"
    ></p-password>
  </div>

  <button class="auth-forgot" type="button" (click)="goToForgotPassword()">
    Passwort vergessen?
  </button>

  <p-button
    label="Anmelden"
    icon="pi pi-sign-in"
    (click)="login()"
    [loading]="loading()"
    styleClass="w-full"
  ></p-button>

  @if (error()) {
    <p class="auth-error">{{ error() }}</p>
  }

  <div class="auth-divider"></div>

  <button class="auth-link" type="button" (click)="backToHome()">
    Zurück zur Startseite
  </button>
</app-auth-card>
