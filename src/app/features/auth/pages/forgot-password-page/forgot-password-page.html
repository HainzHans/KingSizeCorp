<app-auth-card title="Passwort vergessen">
  @if (!sent()) {
    <p class="auth-subtitle">
      Gib deine E-Mail-Adresse ein. Falls ein Konto existiert, schicken wir dir
      einen Link zum Zurücksetzen deines Passworts.
    </p>

    <div class="auth-field">
      <label for="reset-email">E-Mail</label>
      <input
        id="reset-email"
        type="email"
        pInputText
        [(ngModel)]="email"
        placeholder="deine@email.de"
        autocomplete="username"
        (keyup.enter)="submit()"
      />
    </div>

    <p-button
      label="Link anfordern"
      icon="pi pi-send"
      (click)="submit()"
      [loading]="loading()"
      styleClass="w-full"
    ></p-button>
  } @else {
    <p class="auth-note">
      Wenn zu <strong>{{ email }}</strong> ein Konto gehört, ist die E-Mail mit
      dem Link unterwegs. Prüfe auch deinen Spam-Ordner.
    </p>
  }

  <div class="auth-divider"></div>

  <button class="auth-link" type="button" (click)="backToLogin()">
    Zurück zum Login
  </button>
</app-auth-card>
