<app-auth-card title="Neues Passwort">
  @if (!checked()) {
    <p class="auth-note">Einen Moment …</p>
  } @else if (ready()) {
    <p class="auth-subtitle">Vergib jetzt dein Passwort für den Mitgliederbereich.</p>

    <div class="auth-field">
      <label for="new-password">Neues Passwort</label>
      <p-password
        inputId="new-password"
        [(ngModel)]="password"
        [feedback]="true"
        toggleMask="true"
        placeholder="Mindestens 8 Zeichen"
        promptLabel="Passwort wählen"
        weakLabel="Schwach"
        mediumLabel="Mittel"
        strongLabel="Stark"
        (keyup.enter)="submit()"
      ></p-password>
    </div>

    <div class="auth-field">
      <label for="confirm-password">Passwort wiederholen</label>
      <p-password
        inputId="confirm-password"
        [(ngModel)]="confirm"
        [feedback]="false"
        toggleMask="true"
        placeholder="Passwort erneut eingeben"
        (keyup.enter)="submit()"
      ></p-password>
    </div>

    <p-button
      label="Passwort speichern"
      icon="pi pi-check"
      (click)="submit()"
      [loading]="loading()"
      styleClass="w-full"
    ></p-button>

    @if (error()) {
      <p class="auth-error">{{ error() }}</p>
    }
  } @else {
    <p class="auth-subtitle">
      Dieser Link ist ungültig oder abgelaufen. Fordere einen neuen Link an.
    </p>
    <p-button
      label="Neuen Link anfordern"
      icon="pi pi-refresh"
      (click)="goToReset()"
      styleClass="w-full"
    ></p-button>
  }
</app-auth-card>
