<div class="app-layout">

  <app-dashboard-toolbar
    [displayName]="displayName()"
    [roleLabel]="roleLabel()"
    (openSettings)="openSettings()"
    (logout)="logout()"
  />

  <!-- ── Body (Sidebar + Content) ── -->
  <div class="body-layout">

    <app-dashboard-sidebar
      [expanded]="isExpanded()"
      [navItems]="navItems"
      [adminItems]="adminItems"
      [isAdmin]="isAdmin()"
      [activeKey]="activeKey()"
      [displayName]="displayName()"
      [roleLabel]="roleLabel()"
      (toggle)="toggle()"
      (navigate)="setActive($event)"
      (logout)="logout()"
    />

    <!-- Main Content -->
    <main class="main-content">
      @switch (activeKey()) {
        @case ('user-overview') { <app-user-overview-page /> }
        @case ('recordings')    { <app-recordings-page /> }
        @case ('settings')      { <app-settings-page /> }
      }

      @if (isAdmin()) {
        @switch (activeKey()) {
          @case ('admin-overview')     { <app-admin-overview-page /> }
          @case ('admin-appointments') { <app-termine-page /> }
          @case ('admin-community')    { <app-admin-community-page /> }
          @case ('admin-recordings')   { <app-admin-recordings-page /> }
        }
      }
    </main>

  </div>
</div>
