<h1>Einstellungen</h1>
<p>Hier kannst du künftig dein Profil verwalten. Weitere Optionen folgen in Kürze.</p>

<dl class="settings-list">
  <div class="settings-row">
    <dt>Name</dt>
    <dd>{{ displayName() }}</dd>
  </div>
  <div class="settings-row">
    <dt>E-Mail</dt>
    <dd>{{ email() }}</dd>
  </div>
  <div class="settings-row">
    <dt>Rolle</dt>
    <dd>{{ roleLabel() }}</dd>
  </div>
</dl>
